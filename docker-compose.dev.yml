# Configuration Docker Compose pour le DÉVELOPPEMENT
# Utilisation: docker-compose -f docker-compose.dev.yml up
# 
# Avantages:
# - Hot-reload automatique sur changements de code
# - Pas besoin de rebuild l'image à chaque modification
# - Utilise moins de mémoire (pas de copie de données dans l'image)

services:
  redis:
    image: redis:7-alpine
    container_name: fhir-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru

  ollama:
    image: ollama/ollama:latest
    container_name: fhir-ollama-dev
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1

  backend:
    # Mode développement: utilise l'image Python de base au lieu de rebuild
    image: python:3.12-slim
    container_name: fhir-backend-dev
    working_dir: /app
    volumes:
      # Monte tout le code en temps réel (hot-reload)
      - ./backend/app:/app/app
      - ./fhir_clustering:/app/fhir_clustering
      - ./workflows:/app/workflows
      # Monte les données en lecture seule
      - ./data:/app/data:ro
      - ./terminology_omop:/app/terminology_omop:ro
      # Results en lecture-écriture
      - ./results:/app/results
      # Cache pip pour accélérer les installations
      - pip_cache:/root/.cache/pip
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://ollama:11434
      - PYTHONUNBUFFERED=1
      - PYTHONOPTIMIZE=1
      - MALLOC_TRIM_THRESHOLD_=100000
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8000:8000"
    # Installe les dépendances au démarrage puis lance avec reload
    command: >
      bash -c "
        apt-get update && apt-get install -y gcc g++ curl --no-install-recommends && rm -rf /var/lib/apt/lists/* &&
        pip install --no-cache-dir -r /app/app/../requirements.txt &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    # Copie le requirements.txt dans le container
    configs:
      - source: requirements
        target: /app/requirements.txt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  ollama_models:
    driver: local
  pip_cache:
    driver: local

networks:
  default:
    name: fhir-network-dev

configs:
  requirements:
    file: ./backend/requirements.txt
