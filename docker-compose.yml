services:
  redis:
    image: redis:7-alpine
    container_name: fhir-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Limites de ressources pour Redis
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    # Configuration Redis pour limiter l'utilisation mémoire
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru

  ollama:
    image: ollama/ollama:latest
    container_name: fhir-ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Limites de ressources pour Ollama (le plus gourmand)
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    # Décommentez pour GPU (NVIDIA Linux)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 4G
    #     reservations:
    #       memory: 2G
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fhir-backend
    volumes:
      - backend_results:/app/results
      # Volumes pour les données (au lieu de les copier dans l'image)
      - ./data:/app/data
      - ./terminology_omop:/app/terminology_omop:ro
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://ollama:11434
      - PYTHONUNBUFFERED=1
      # Optimisations Python pour la mémoire
      - PYTHONOPTIMIZE=1
      - MALLOC_TRIM_THRESHOLD_=100000
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    # Limites de ressources pour le backend
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  ollama_models:
    driver: local
  backend_results:
    driver: local

networks:
  default:
    name: fhir-network
